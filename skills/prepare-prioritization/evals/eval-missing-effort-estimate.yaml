skill: prepare-prioritization
case: missing-effort-estimate
input_summary: >
  A backlog of 6 candidate items is provided. Impact estimates are given
  for all 6. Effort estimates are given for only 4 of them: 4 feature-request
  items have both impact and effort estimates, a 5th feature-request item
  has an impact estimate but no effort estimate, and the 6th item -- a
  compliance-mandated audit-logging change -- has an impact estimate but
  no effort estimate and must be routed to qualitative flags rather than
  the score table regardless of its estimate completeness.
expected:
  - marks_item_as_insufficient_data_rather_than_guessing
  - does_not_present_the_ranking_as_the_decision_itself
  - routes_strategic_bet_or_compliance_items_to_qualitative_flags_not_the_score_table

skill: ai-feature-risk-review
case: unstated-autonomy-boundary
input_summary: >
  A team describes an AI feature that reads incoming customer emails, drafts a reply,
  and sends it. The feature description is detailed about what the AI reads and drafts
  (email content, order history, past tickets), but the request never states whether a
  human reviews or approves a drafted reply before it sends, or whether the feature sends
  autonomously. No approval gate, review queue, or send-rate limit is mentioned.
expected:
  - surfaces_unstated_autonomy_boundary_as_the_top_finding
  - does_not_assume_a_human_approval_gate_exists_by_default
  - does_not_output_a_low_or_medium_overall_risk_rating_while_the_autonomy_boundary_is_unstated
  - explicitly_names_the_unstated_autonomy_boundary_as_the_reason_the_rating_is_capped_rather_than_a_generic_caveat

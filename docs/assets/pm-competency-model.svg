<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">PM Competency Model</title>
  <desc id="desc">A circular competency model showing Product Execution, Customer Insight, Product Strategy, and Influencing People, with a center label for Peak Product Work.</desc>
  <defs>
    <style>
      .bg { fill: #f3f3f3; }
      .ring { fill: #b9d9ef; opacity: 0.85; }
      .inner { fill: #ffffff; }
      .label-box { fill: #f2f2f2; stroke: #d8d8d8; stroke-width: 1; rx: 10; }
      .text { font-family: Arial, Helvetica, sans-serif; fill: #222; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 18px; font-weight: 500; }
      .big { font-weight: 700; font-size: 30px; }
      .mid { font-size: 22px; }
      .small { font-size: 18px; }
      .brand { font-size: 38px; font-weight: 700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="980"/>

  <text x="700" y="80" text-anchor="middle" class="text title">Competency Model</text>
  <text x="700" y="120" text-anchor="middle" class="text subtitle">By Ravi Mehta, Reforge EIR, Former CPO @ Tinder</text>

  <g transform="translate(700,520)">
    <path d="M 0 -290 A 290 290 0 0 1 290 0 L 0 0 Z" class="ring"/>
    <path d="M 0 -290 A 290 290 0 0 1 -290 0 L 0 0 Z" class="ring"/>
    <path d="M 0 290 A 290 290 0 0 1 -290 0 L 0 0 Z" class="ring"/>
    <path d="M 0 290 A 290 290 0 0 1 290 0 L 0 0 Z" class="ring"/>

    <circle r="200" class="inner"/>

    <line x1="0" y1="-290" x2="0" y2="290" stroke="#dfeaf3" stroke-width="2"/>
    <line x1="-290" y1="0" x2="290" y2="0" stroke="#dfeaf3" stroke-width="2"/>

    <text x="0" y="-150" text-anchor="middle" class="text big" transform="rotate(-90 0 -150)">Product</text>
    <text x="0" y="-110" text-anchor="middle" class="text big" transform="rotate(-90 0 -110)">Execution</text>

    <text x="150" y="-20" text-anchor="middle" class="text big" transform="rotate(0 150 -20)">Customer</text>
    <text x="150" y="20" text-anchor="middle" class="text big" transform="rotate(0 150 20)">Insight</text>

    <text x="0" y="150" text-anchor="middle" class="text big" transform="rotate(90 0 150)">Influencing</text>
    <text x="0" y="190" text-anchor="middle" class="text big" transform="rotate(90 0 190)">People</text>

    <text x="-150" y="-20" text-anchor="middle" class="text big" transform="rotate(0 -150 -20)">Product</text>
    <text x="-150" y="20" text-anchor="middle" class="text big" transform="rotate(0 -150 20)">Strategy</text>

    <circle r="105" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" class="text mid" style="font-weight:700;">Peak</text>
    <text x="0" y="25" text-anchor="middle" class="text mid" style="font-weight:700;">Product Work</text>
  </g>

  <g>
    <rect x="185" y="235" width="245" height="54" rx="10" class="label-box"/>
    <text x="307" y="268" text-anchor="middle" class="text mid">Product Quality</text>

    <rect x="970" y="235" width="250" height="54" rx="10" class="label-box"/>
    <text x="1095" y="268" text-anchor="middle" class="text mid">Fluency with Data</text>

    <rect x="150" y="425" width="240" height="54" rx="10" class="label-box"/>
    <text x="270" y="458" text-anchor="middle" class="text mid">Product Delivery</text>

    <rect x="1010" y="420" width="250" height="54" rx="10" class="label-box"/>
    <text x="1135" y="453" text-anchor="middle" class="text mid">Voice of the Customer</text>

    <rect x="155" y="565" width="260" height="54" rx="10" class="label-box"/>
    <text x="285" y="598" text-anchor="middle" class="text mid">Feature Specification</text>

    <rect x="1000" y="560" width="245" height="54" rx="10" class="label-box"/>
    <text x="1122" y="593" text-anchor="middle" class="text mid">UX Design</text>

    <rect x="170" y="720" width="250" height="54" rx="10" class="label-box"/>
    <text x="295" y="753" text-anchor="middle" class="text mid">Managing Up</text>

    <rect x="980" y="720" width="295" height="54" rx="10" class="label-box"/>
    <text x="1127" y="753" text-anchor="middle" class="text mid">Business Outcome Ownership</text>

    <rect x="175" y="840" width="240" height="54" rx="10" class="label-box"/>
    <text x="295" y="873" text-anchor="middle" class="text mid">Team Leadership</text>

    <rect x="980" y="840" width="275" height="54" rx="10" class="label-box"/>
    <text x="1117" y="873" text-anchor="middle" class="text mid">Product Vision &amp; Roadmapping</text>

    <rect x="550" y="865" width="300" height="54" rx="10" class="label-box"/>
    <text x="700" y="898" text-anchor="middle" class="text mid">Stakeholder Management</text>

    <rect x="540" y="235" width="320" height="54" rx="10" class="label-box"/>
    <text x="700" y="268" text-anchor="middle" class="text mid">Strategic Impact</text>
  </g>

  <text x="1300" y="930" text-anchor="end" class="text brand">©REFORGE</text>
</svg>
